name: Renova
options:
  bundleIdPrefix: com.sookra
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  LiteRTLM:
    url: https://github.com/google-ai-edge/LiteRT-LM
    # Pinned to the v0.13.1 manifest commit, the last internally consistent
    # moment in this package's history. The v0.14.0 tag refuses to resolve
    # (Google replaced its binary artifacts after tagging, stale checksums),
    # and every post-0.14.0 Swift revision calls thinking/constraint/stream
    # C functions the served 0.14.0 xcframework does not export (verified
    # against the artifact's own headers: 112 exported functions, none of
    # those). At this commit the manifest, the Swift wrapper, and the v0.13.1
    # binaries agree with each other.
    revision: 23c259bbe66d43120489fdc046fa575d1cd61c44
targets:
  Renova:
    type: application
    platform: iOS
    sources:
      - path: Renova
        excludes:
          - Resources
      - path: Renova/Resources
        buildPhase: resources
    dependencies:
      - package: LiteRTLM
        product: LiteRTLM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sookra.renova
        DEVELOPMENT_TEAM: Y8XVCMLQCZ
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: 'YES'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # HTTPS only, no custom crypto: answers the export-compliance question
        # in the build itself so TestFlight builds never sit on "Missing
        # Compliance".
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: 'NO'
        INFOPLIST_KEY_NSCameraUsageDescription: Renova photographs your renewal packet so it can be read on this device. Photos never leave your iPhone.
        INFOPLIST_KEY_UILaunchScreen_Generation: 'YES'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        SWIFT_VERSION: '5.9'
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: '2'

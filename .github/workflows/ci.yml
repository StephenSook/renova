name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A judge clones this repo. Everything below is the promise that the clone works.
jobs:
  verify:
    name: Build, test, and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` triggers postinstall, which vendors the LiteRT wasm, the
      # onnxruntime wasm, the PP-OCR models, and the fonts. If any of those
      # sources moves, CI fails here rather than a judge discovering it.
      - name: Install and vendor runtime assets
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Unit tests
        run: npm test

      # The safety-field harness. Gates on all four fields being exact or
      # escalating by design, plus eight behavioural checks. Exits non-zero on
      # any failure, so a regression in the extractor cannot reach main.
      - name: Evaluation harness
        run: npm run eval

      - name: Lint
        run: npm run lint

      # Every runtime asset must be present in the built output. The offline
      # claim is false the moment one of these is missing, and it would be
      # invisible until someone tried it with the network off.
      - name: Assert self-hosted runtime shipped
        run: |
          set -e
          for f in \
            dist/litertlm-wasm/litertlm_wasm_internal.wasm \
            dist/ort/ort-wasm-simd-threaded.jsep.wasm \
            dist/models/ocr/det.onnx \
            dist/models/ocr/rec.onnx \
            dist/models/ocr/dict.txt \
            dist/fonts/public-sans.woff2 \
            dist/fonts/bricolage.woff2 \
            dist/manifest.webmanifest
          do
            test -f "$f" || { echo "MISSING from build output: $f"; exit 1; }
          done
          echo "all self-hosted runtime assets present"

      - name: Install a browser for the offline assertion
        run: npx playwright install --with-deps chromium

      # The offline claim, tested rather than asserted: serve the build, load it
      # in a real browser, drive OCR, and fail on any request to another host.
      #
      # This replaced a grep for CDN URLs in the bundle. That grep failed on its
      # first run and was right to, but for the wrong reason: both @litert-lm/core
      # and onnxruntime-web carry their CDN defaults as string constants and we
      # override both at runtime. A grep cannot tell a dead default from a live
      # fetch. This can.
      - name: Assert zero external requests
        run: node scripts/assert-offline.mjs

      # Model weights must never be committed. Gemma is fetched or side-loaded.
      - name: Assert no model weights committed
        run: |
          set -e
          if git ls-files | grep -E '\.(litertlm|task|gguf|safetensors)$'; then
            echo "Model weights are committed. They must be fetched, not shipped in git."
            exit 1
          fi
          echo "no model weights in git"

      # Private planning material lives in a different directory and must never
      # appear here.
      - name: Assert no private material
        run: |
          set -e
          if git ls-files | grep -iE 'build_plan|recon|calibration|\.pdf$'; then
            echo "Private planning material is tracked in a public repo."
            exit 1
          fi
          echo "no private material tracked"

  secrets:
    name: Secret scan, full history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Runs bare. A pipe would return the pipe's exit code and swallow a real
      # finding, which has bitten this workflow style before.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
